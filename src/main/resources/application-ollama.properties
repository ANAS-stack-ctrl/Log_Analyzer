## Profil Ollama (LLM local + RAG) — 100% local, aucun cloud
## Activez avec: --spring.profiles.active=dev,ollama

# LLM de génération (qwen3:8b — plus léger/stable que deepseek-r1 sur 16 Go)
app.ai.enabled=true
app.ai.api-key=
app.ai.model=qwen3:8b
app.ai.base-url=http://localhost:11434/v1
app.ai.temperature=0.1
app.ai.max-context-chars=48000
app.ai.max-chat-context-chars=36000

# Port alternatif (8081 = défaut application.properties)
server.port=8082

# ── Module RAG : OFF sans Docker/pgvector (Postgres local 5432) ──
# Remettre app.rag.enabled=true + datasource 5433 si tu relances pg-vector.
app.rag.enabled=false
app.rag.embedding-model=nomic-embed-text
app.rag.embedding-base-url=http://localhost:11434/v1
app.rag.embedding-api-key=
app.rag.dimension=768
app.rag.chunk-size=20
app.rag.chunk-overlap=4
app.rag.top-k=6
app.rag.index-mode=smart
app.rag.keep-every-nth-normal=8
app.rag.slow-threshold-ms=2000
app.rag.max-chunks-per-import=3000
app.rag.insert-batch-size=50

# Archivage (créer logs_archive_db puis activer)
# app.archive.enabled=true
