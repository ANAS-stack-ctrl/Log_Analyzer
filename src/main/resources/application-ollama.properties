## Profil Ollama (LLM local)
## Activez avec: --spring.profiles.active=dev,ollama

# Important : l'app doit pointer vers l'API OpenAI-compatible d'Ollama
app.ai.enabled=true
app.ai.api-key=
app.ai.model=qwen3:8b
app.ai.base-url=http://localhost:11434/v1
app.ai.temperature=0.1
app.ai.max-context-chars=48000
app.ai.max-chat-context-chars=36000

# Optionnel: port alternatif si 8081 est déjà pris
server.port=8082

# Archivage (créer logs_archive_db puis activer)
# app.archive.enabled=true

