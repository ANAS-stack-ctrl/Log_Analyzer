spring.application.name=log-analyzer
server.port=8081

# Postgres local (sans Docker). RAG/pgvector désactivé → voir application-ollama.properties.
spring.datasource.url=jdbc:postgresql://localhost:5432/logs_db
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=5GB
# 0 = toujours écrire sur disque (évite OOM quand on upload beaucoup de fichiers)
spring.servlet.multipart.file-size-threshold=0
server.tomcat.max-swallow-size=-1

spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.auto-commit=false

# JWT
app.security.jwt.secret=VGhpc0lzQVN1cGVyU2VjdXJlSldUU2VjcmV0S2V5Rm9yTG9nQW5hbHl6ZXIyMDI2
app.security.jwt.access-token-minutes=15
app.security.jwt.refresh-token-days=7
app.security.jwt.issuer=log-analyzer

spring.profiles.active=dev

# Archivage imports inactifs (désactivé par défaut)
app.archive.enabled=false
app.archive.inactive-days=60
app.archive.purge-days=365
app.archive.batch-size=1
app.archive.cron=0 0 3 * * *
app.archive.datasource.url=jdbc:postgresql://localhost:5432/logs_archive_db
app.archive.datasource.username=postgres
app.archive.datasource.password=admin

# Assistant IA — désactivé par défaut. Profil ollama = 100% local (localhost:11434).
# Ne jamais activer une URL cloud ici pour des logs confidentiels.
app.ai.enabled=false
app.ai.api-key=
app.ai.model=qwen3:8b
app.ai.base-url=http://localhost:11434/v1
app.ai.temperature=0.1
app.ai.max-context-chars=48000
app.ai.max-chat-context-chars=36000