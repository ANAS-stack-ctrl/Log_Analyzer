# ============================================================================
#  Config RAG — à AJOUTER dans application-ollama.properties (ou application.properties)
#  Le module ne s'active que si app.rag.enabled=true.
# ============================================================================

# Active le RAG
app.rag.enabled=true

# Modèle d'embeddings (à faire tourner dans Ollama : ollama pull nomic-embed-text)
app.rag.embedding-model=nomic-embed-text
app.rag.embedding-base-url=http://localhost:11434/v1
app.rag.embedding-api-key=
# nomic-embed-text = 768 dimensions (DOIT matcher vector(768) dans rag-schema.sql)
app.rag.dimension=768

# Découpage des logs en fenêtres
app.rag.chunk-size=20
app.rag.chunk-overlap=4

# Recherche : nombre d'extraits envoyés au LLM
app.rag.top-k=8

# Indexation : "smart" (recommandé) ou "all"
app.rag.index-mode=smart
app.rag.keep-every-nth-normal=6
app.rag.slow-threshold-ms=2000
app.rag.max-chunks-per-import=20000
app.rag.insert-batch-size=100

# ── Rappel : le LLM de génération reste piloté par app.ai.* ──
